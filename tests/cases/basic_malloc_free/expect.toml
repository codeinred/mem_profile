# C allocation path: malloc in ctor, free in dtor.
#
# On macOS this depends on the runtime's __DATA,__interpose table: plain
# DYLD_INSERT_LIBRARIES does not interpose the C malloc/free (two-level
# namespaces bind them to libSystem; only the weak C++ operators coalesce),
# so this case is the regression guard for the interpose mechanism.

[totals]
typed_free_bytes = { min = 3700 }

[[types]]
type = "CBuf"
size = 8
objects = 2
bytes = 3700
