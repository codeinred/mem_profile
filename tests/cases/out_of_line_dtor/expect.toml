# Out-of-line dtor definition (same TU). Regression guard for gh-2:
# external-linkage destructor definitions are emitted by CodeGen mid-parse,
# so they must be instrumented in the eager HandleTopLevelDecl pass — an
# end-of-TU rewrite arrives after the IR is already emitted.

[ir]
instrumented = ["OutOfLine"]

[[types]]
type = "OutOfLine"
size = 24
objects = 1
bytes = 2000

  [[types.fields]]
  name = "v"
  offset = 0
  bytes = 2000
